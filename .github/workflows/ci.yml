name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # --------------------------------------------------------------------------
  # 1. Lint — ruff (linter + formatter check)
  # --------------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff>=0.4

      - name: ruff check (linter)
        run: ruff check itdoc/ scripts/ tests/

      - name: ruff format --check (formatter)
        run: ruff format --check itdoc/ scripts/ tests/

  # --------------------------------------------------------------------------
  # 2. Tests — matrix 3.10 / 3.11 / 3.12, równoległe (pytest-xdist)
  # --------------------------------------------------------------------------
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests (parallel, no slow/integration)
        run: pytest -m "not slow and not integration" -q --tb=short -n auto

      - name: Coverage report
        run: |
          pytest -m "not slow and not integration" \
            --cov=scripts --cov=itdoc \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=36 \
            -q -n auto
        continue-on-error: true

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          flags: unittests
          fail_ci_if_error: false

  # --------------------------------------------------------------------------
  # 3. Strict-test — ITDOC_STRICT=1, ujawnia ukryte błędy w batch scripts
  # --------------------------------------------------------------------------
  strict-test:
    name: Strict mode (ITDOC_STRICT=1)
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests in strict mode
        env:
          ITDOC_STRICT: "1"
        run: pytest -m "not slow and not integration" -q --tb=short -x

  # --------------------------------------------------------------------------
  # 4. Type check — mypy na itdoc/ (stopniowe wdrożenie)
  # --------------------------------------------------------------------------
  type-check:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    needs: lint
    continue-on-error: true    # nie blokuje CI — stopniowe wdrożenie

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install mypy + project
        run: pip install mypy>=1.10 && pip install -e ".[dev]"

      - name: mypy itdoc/
        run: mypy itdoc/ --ignore-missing-imports --no-error-summary || true

