name: Security (Bandit + pip-audit)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 5 * * 1"

jobs:
  bandit:
    name: Bandit SAST
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install bandit[sarif]

      - name: Run Bandit (SARIF output)
        run: |
          bandit -r scripts/ itdoc/ \
            -f sarif \
            -o bandit-results.sarif \
            --severity-level medium \
            --confidence-level medium \
            || true  # don't fail build

      - name: Upload Bandit SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: bandit-results.sarif
          category: "bandit"

      - name: Run Bandit (text summary)
        run: |
          bandit -r scripts/ itdoc/ \
            --severity-level high \
            --confidence-level high \
            -f text \
            || true

  pip-audit:
    name: pip-audit (CVE check)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Install project deps
        run: pip install -e ".[dev]"

      - name: Run pip-audit
        run: |
          pip-audit \
            --format=markdown \
            --output=pip-audit-report.md \
            || true
          cat pip-audit-report.md || echo "No vulnerabilities found"

      - name: Upload pip-audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-report
          path: pip-audit-report.md
