    faz testowania, kryteria go/no-go.
  purpose: Definiuje podejście do testowania — scope, typy testów (jednostkowe, integracyjne, systemowe, UAT, regresja), narzędzia,
    środowiska, role i harmonogram. Stanowi kontrakt jakościowy między QA a projektem.
  relationships: '"Scope testów" **constrains** "Zbiór przypadków testowych".

    - "Kryteria wyjścia" **drives** "Decyzję go/no-go".

    - "Raporty z testów" **feeds** "Analizę ryzyk projektu".'
