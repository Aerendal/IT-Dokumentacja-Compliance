  relationships: '"Warunki wstępne" **must precede** "Wykonanie kroków testowych".

    - "Oczekiwany vs rzeczywisty wynik" **drives** "Raport defektu".

    - "Pokrycie wymagań" **feeds** "Raport z testów i decyzję release".'
