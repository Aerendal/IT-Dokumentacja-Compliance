# Archetypy dokumentów IT do wzbogacania szablonów
# Generowany z: scripts/maintenance/enrich_placeholders.py

archetypes:
- dependencies: Polityka bezpieczeństwa, rejestr zasobów, plany testów penetracyjnych, kontrakty z dostawcami (SLA).
  impacts: Raport postmortem, plan zarządzania ryzykiem, polityka bezpieczeństwa (aktualizacje), plany ciągłości działania
    (BCP).
  inputs: Polityka bezpieczeństwa informacji, rejestr ryzyk, plany komunikacji, dane z systemów monitorowania (SIEM/alerting),
    kontakty zewnętrzne (CSIRT, vendor).
  keywords:
  - incident response
  - response plan
  - reagowanie na incydent
  - obsługa incydentu
  - incident handling
  - response procedure
  - outage response
  - breach response
  - alert response
  - failure response
  name: incident_response
  outputs: Wypełniony ticket incydentu, raport postmortem, aktualizacja rejestru incydentów, wnioski do planu zarządzania
    ryzykiem.
  purpose: 'Definiuje procedurę reagowania na incydenty — od wykrycia przez analizę, izolację i eliminację do odtworzenia
    i wnioskowania poreaktywnego. Zawiera: klasyfikację incydentów (P1–P4), macierz eskalacji, role i odpowiedzialności (RACI),
    kroki runbooka, kryteria powiadomień regulacyjnych.'
  relationships: '"Klasyfikacja incydentu" **determines** "Eskalację i notyfikacje".

    - "Izolacja" **precedes** "Eliminację" i **feeds** "Analizę przyczyn źródłowych".

    - "Wnioski" **feeds** "Aktualizację polityki bezpieczeństwa" i "Rejestr ryzyk".'
- dependencies: Analiza BIA, rejestr zasobów (CMDB), polityka backupów, plany zarządzania incydentami.
  impacts: Plany testów DR, raporty z ćwiczeń, umowy z dostawcami cloud/hostingiem, polityki retencji backupów, plany komunikacji
    kryzysowej.
  inputs: Analiza wpływu na biznes (BIA), inwentarz systemów (CMDB), umowy SLA z dostawcami, wyniki ostatnich testów DR, topologia
    sieci i infrastruktury.
  keywords:
  - disaster recovery
  - odtwarzanie po awarii
  - business continuity
  - ciągłość działania
  - bcp
  - drp
  - recovery plan
  - business impact
  - bia
  name: disaster_recovery
  outputs: Plan testów DR, harmonogram ćwiczeń, raporty z testów, zaktualizowane procedury runbooka, metryki RTO/RPO.
  purpose: 'Określa cele odtworzeniowe (RTO, RPO) i procedury przywracania usług po katastrofie lub poważnej awarii. Zawiera:
    krytyczne systemy i priorytety odtworzenia, kolejność działań, alternatywne lokalizacje/środowiska, harmonogram testów
    BCP/DR.'
  relationships: '"BIA i priorytety" **drives** "Kolejność odtworzenia".

    - "Procedury odtworzenia" **feeds** "Runbooki operacyjne".

    - "Wyniki testów DR" **updates** "RTO/RPO i cele odtworzeniowe".'
- dependencies: Wymagania systemowe, istniejące ADR (kontekst), wyniki proof-of-concept, standardy technologiczne organizacji.
  impacts: Dokumenty projektowe systemów, specyfikacje API, plany migracji, konfiguracje infrastruktury, wymagania niefunkcjonalne
    (NFR).
  inputs: Wymagania systemowe, ograniczenia techniczne i biznesowe, dostępne technologie, istniejąca architektura, wyniki
    spike'ów/prototypów.
  keywords:
  - architecture decision
  - adr
  - architectural decision
  - decision record
  name: architecture_decision
  outputs: Zatwierdzona decyzja architektoniczna z uzasadnieniem, lista odrzuconych alternatyw z powodami, implikacje dla
    innych komponentów.
  purpose: Dokumentuje pojedynczą decyzję architektoniczną — kontekst, problem, rozważane opcje, podjętą decyzję, uzasadnienie
    i konsekwencje. Format ADR umożliwia śledzenie ewolucji architektury i rozumienie historycznych wyborów projektowych.
  relationships: '"Kontekst i problem" **drives** "Opcje do rozważenia".

    - "Wybrana opcja" **constrains** "Implementację i konfigurację".

    - "Konsekwencje" **feeds** "Kolejne ADR i risk register".'
- dependencies: Wymagania funkcjonalne i NFR, polityki bezpieczeństwa, ograniczenia compliance, istniejąca architektura (as-is).
  impacts: Szczegółowe projekty komponentów, specyfikacje API, plany testów (NFR), dokumentacja wdrożeniowa, plany migracji.
  inputs: Wymagania biznesowe i niefunkcjonalne, ograniczenia (budżet, czas, regulacje), istniejące systemy i integracje,
    standardy technologiczne organizacji.
  keywords:
  - system architecture
  - architektura systemu
  - architecture overview
  - high-level design
  - hld
  - architektura platformy
  - architektura aplikacji
  - architektura rozwiązania
  - solution architecture
  name: system_architecture
  outputs: Diagram architektoniczny (C4/UML), opis komponentów i interfejsów, macierz decyzji, lista ADR do podjęcia, wytyczne
    dla projektowania szczegółowego.
  purpose: Opisuje strukturę wysokiego poziomu systemu — komponenty, ich odpowiedzialności, wzajemne zależności i przepływy
    danych. Stanowi kontrakt architektoniczny dla zespołów implementujących, podstawę dla ADR i wejście do szczegółowego projektowania.
  relationships: '"Wymagania NFR" **constrains** "Wybory architektoniczne".

    - "Diagram komponentów" **drives** "Specyfikacje interfejsów".

    - "Decyzje architektoniczne" **feeds** "ADR log".'
- dependencies: Wywiady ze stakeholderami, analiza procesów as-is, standardy regulacyjne/branżowe, architektura to-be.
  impacts: Specyfikacje projektowe, plany testów akceptacyjnych (UAT), backlog produktu, dokumentacja API, szacowania pracochłonności.
  inputs: Wizja produktu, cele biznesowe, wywiady ze stakeholderami, analiza rynku/konkurencji, ograniczenia prawne i techniczne,
    istniejące systemy (as-is).
  keywords:
  - wymagania
  - requirements specification
  - software requirements
  - business requirements
  - functional requirements
  - system requirements
  - specyfikacja wymagań
  name: wymagania
  outputs: Rejestr wymagań z ID i priorytetami, macierz śledzności (traceability), kryteria akceptacji, lista pytań otwartych,
    baseline dla zarządzania zmianami.
  purpose: 'Definiuje kompletny, weryfikowalny zbiór wymagań funkcjonalnych i niefunkcjonalnych. Każde wymaganie powinno być:
    unikalne (ID), jednoznaczne, testowalnie zdefiniowane, przypisane do priorytetu (MoSCoW) i powiązane z przypadkiem użycia
    lub epikiem.'
  relationships: '"Wymagania funkcjonalne" **drives** "Przypadki testowe UAT".

    - "Wymagania NFR" **constrains** "Architekturę systemu".

    - "Priorytety MoSCoW" **feeds** "Backlog i planowanie sprintów".'
- dependencies: Epiki i cel sprintu, persona użytkownika, wyniki testów użyteczności, techniczne spike'i.
  impacts: Sprint backlog, plan sprintu, testy akceptacyjne, dokumentacja zmian w produkcie.
  inputs: Wizja produktu, persona użytkownika, wyniki badań UX, cele sprintu/releasu, feedback z poprzednich sprintów.
  keywords:
  - user stor
  - user stories
  - historia użytkownika
  - story mapping
  - user story
  name: user_stor
  outputs: Wyspecyfikowane stories gotowe do sprintu (DoR), kryteria akceptacji per story, estymacje, macierz zależności między
    stories.
  purpose: 'Zawiera zbiór historyjek użytkownika (user stories) w formacie: Jako [rola] chcę [akcja] po to, żeby [wartość].
    Każda story powinna mieć kryteria akceptacji (Given-When-Then), estymację (story points) i powiązanie z epikiem.'
  relationships: '"Kryterium akceptacji" **drives** "Testy automatyczne i manualne".

    - "Story points" **feeds** "Velocity i planowanie kapacytetu".

    - "Zależności stories" **constrains** "Kolejność sprintów".'
- dependencies: Specyfikacja wymagań, architektura systemu, plan projektu, polityki jakości organizacji.
  impacts: Przypadki testowe (test cases), raporty z testów, bug tracker, metryki jakości (defect density, coverage), decyzja
    go-live.
  inputs: Wymagania funkcjonalne i NFR, architektura systemu, harmonogram projektu, dostępne zasoby QA, kryteria wejścia i
