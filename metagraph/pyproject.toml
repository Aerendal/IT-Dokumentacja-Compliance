[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "metagraph"
version = "0.1.0"
description = "Meta-Graf Wiedzy — offline-first graph knowledge system"
requires-python = ">=3.9"
dependencies = ["click>=8.0", "rich>=13.0", "pydantic>=2.0"]

[tool.setuptools.packages.find]
where = [".."]
include = ["metagraph*"]

[project.scripts]
mg = "metagraph.cli.main:cli"
