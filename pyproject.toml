[project]
name = "itdoc"
version = "0.1.0"
description = "Biblioteka Python dla IT Dokumentacja — 7966 szablonów IT"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
include = ["itdoc*", "metagraph*", "scripts*"]

[project.scripts]
mg = "metagraph.cli.main:cli"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.0",
    "fastapi>=0.100",
    "httpx>=0.24",
    "uvicorn>=0.22",
    "pydantic>=2.0",
    "requests>=2.28",
    "ruff==0.15.4",
    "autoflake>=2.3",
    "pre-commit>=3.7",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: Szybkie testy jednostkowe bez dostępu do DB (< 5s)",
    "integration: Testy wymagające rzeczywistej DB it_doc_matrix.db",
    "slow: Testy integracyjne pipeline (> 30s) — pomijane w szybkim CI",
]
# Domyślnie uruchamiaj wszystkie testy oprócz slow
# Użyj:  pytest -m "not slow"  dla szybkiego CI
# Użyj:  pytest                dla pełnego zestawu (z --ignore=... jeśli brak DB)
addopts = "--tb=short -q"
pythonpath = ["."]
filterwarnings = ["ignore::urllib3.exceptions.NotOpenSSLWarning", "ignore::UserWarning"]

[tool.coverage.run]
source = ["itdoc", "scripts"]
omit = ["tests/*", "scripts/__pycache__/*"]

[tool.coverage.report]
show_missing = true
fail_under = 36

[tool.mutmut]
paths_to_mutate = ["scripts/maintenance/"]
tests_dir = ["tests/test_maintenance_scripts.py"]
pytest_add_cli_args = ["-x", "-q", "--tb=no"]
also_copy = ["scripts/__init__.py", "scripts/maintenance/__init__.py"]

# ---------------------------------------------------------------------------
# Ruff — linter + formatter (zastępuje flake8, isort, black)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py39"
exclude = [
    ".git", "__pycache__", ".pytest_cache",
    "generated_templates", "dokumentacja",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, undefined names)
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (ruff format handles it)
    "E402",  # module-level import not at top (conditional imports pattern)
    "E701",  # multiple statements on one line (colon) — pre-existing
    "E702",  # multiple statements on one line (semicolon) — pre-existing
    "B005",  # strip with multi-char string — pre-existing (BOM stripping pattern)
    "B007",  # loop control variable not used in loop body — intentional
    "B008",  # do not perform function calls in default args
    "E741",  # ambiguous variable name (l, O, I) — pre-existing
    "UP007", # use X | Y instead of Optional[X] (requires py3.10+)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F811"]  # redefined-while-unused (fixtures)

[tool.ruff.lint.isort]
known-first-party = ["itdoc", "scripts", "metagraph"]

# ---------------------------------------------------------------------------
# Mypy — opcjonalne sprawdzanie typów (stopniowe wdrożenie)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.9"
warn_unused_ignores = true
warn_return_any = false
ignore_missing_imports = true
exclude = [
    "generated_templates/",
    "dokumentacja/",
    "tests/",
]
