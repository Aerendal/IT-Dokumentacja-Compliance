[project]
name = "itdoc"
version = "0.1.0"
description = "Biblioteka Python dla IT Dokumentacja — 7966 szablonów IT"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
include = ["itdoc*", "metagraph*"]

[project.scripts]
mg = "metagraph.cli.main:cli"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "fastapi>=0.100",
    "httpx>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: Szybkie testy jednostkowe bez dostępu do DB (< 5s)",
    "integration: Testy wymagające rzeczywistej DB it_doc_matrix.db",
    "slow: Testy integracyjne pipeline (> 30s) — pomijane w szybkim CI",
]
# Domyślnie uruchamiaj wszystkie testy oprócz slow
# Użyj:  pytest -m "not slow"  dla szybkiego CI
# Użyj:  pytest                dla pełnego zestawu (z --ignore=... jeśli brak DB)
addopts = "--tb=short -q"
filterwarnings = ["ignore::urllib3.exceptions.NotOpenSSLWarning", "ignore::UserWarning"]

[tool.coverage.run]
source = ["itdoc", "scripts"]
omit = ["tests/*", "scripts/__pycache__/*"]

[tool.coverage.report]
show_missing = true
fail_under = 36

[tool.mutmut]
paths_to_mutate = ["scripts/maintenance/"]
tests_dir = ["tests/test_maintenance_scripts.py"]
pytest_add_cli_args = ["-x", "-q", "--tb=no"]
also_copy = ["scripts/__init__.py", "scripts/maintenance/__init__.py"]
