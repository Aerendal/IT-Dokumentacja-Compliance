        - in: path
          name: plan_id
          required: true
          schema: { $ref: '#/components/schemas/UUID' }
        - in: query
          name: format
          schema: { type: string, enum: [json, markdown], default: markdown }
      responses:
        "200":
          description: Widok sekwencji
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    phase_id:    { type: integer }
                    phase_name:  { type: string }
                    packages:    { type: array, items: { $ref: '#/components/schemas/WorkPackage' } }
            text/markdown:
              schema: { type: string }
        "404": { description: Plan nie znaleziony }

        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
  # Export/Import projektu
  /projects/{project_id}/export:
    get:
      tags: [Core]
      summary: Eksportuj projekt do archiwum ZIP
      description: Zwraca ZIP z JSON project.json + briefs/ + mappings/ + reports/ + plans/
      parameters:
        - {name: project_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Archiwum ZIP
          content:
            application/zip:
              schema: {type: string, format: binary}

        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
  /projects/import:
    post:
      tags: [Core]
      summary: Importuj projekt z archiwum ZIP
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: {type: string, format: binary}
                new_name: {type: string}
      responses:
        '201': {description: Zaimportowany projekt}

        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
  # Porównanie raportów
  /reports/compare:
    get:
      tags: [Side 3 — Reports]
      summary: Porównaj dwa raporty kosztorysowe
      parameters:
        - {name: report_id_a, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: report_id_b, in: query, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Diff między raportami
          content:
            application/json:
              schema:
                type: object
                properties:
                  added_docs: {type: array, items: {$ref: '#/components/schemas/DocumentEstimate'}}
                  removed_docs: {type: array, items: {$ref: '#/components/schemas/DocumentEstimate'}}
                  changed_estimates:
                    type: array
                    items:
                      type: object
                      properties:
                        doc_uid: {type: string}
                        h_before: {type: number}
                        h_after: {type: number}
                  total_h_delta:
                    type: object
                    properties:
                      min: {type: number}
                      likely: {type: number}
                      max: {type: number}

        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServerError'
